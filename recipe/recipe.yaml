schema_version: 1

context:
  version: 0.6.1

package:
  name: pytest-dependency
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pytest-dependency/pytest_dependency-${{ version }}.tar.gz
  sha256: 246c24d2a5fc743a942cec4408853640e56a05ba58d46e5b213a1d4b738a2464

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools_scm
    - setuptools
  run:
    - pytest >=3.6.0
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - pytest_dependency
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Manage dependencies of tests
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/RKrahl/pytest-dependency

extra:
  recipe-maintainers:
    - Windiana42
